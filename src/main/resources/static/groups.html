<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Группы — Университет</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css?v=20260420-20">
</head>

<body>
<div id="appHeaderMount" data-active="groups"></div>
<main class="page-shell" id="groupsPage">
    <div class="container">
        <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3 mb-4">
            <div>
                <p class="section-title mb-1">Справочник</p>
                <h1 class="h3 fw-bold text-uppercase mb-0">Группы</h1>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-outline-dark" id="reloadGroups">
                    <i class="bi bi-arrow-clockwise me-1"></i>Обновить
                </button>
                <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#groupModal">
                    <i class="bi bi-plus-lg me-1"></i>Добавить группу
                </button>
            </div>
        </div>

        <div class="card-glass p-3 p-md-4">
            <div class="row g-3 mb-2">
                <div class="col-md-6 col-lg-4">
                    <label class="form-label text-muted small text-uppercase">Поиск</label>
                    <input type="text" class="form-control" id="groupSearch" placeholder="Название группы">
                </div>
                <div class="col-md-6 col-lg-4">
                    <label class="form-label text-muted small text-uppercase">Факультет</label>
                    <select class="form-select" id="groupFacultyFilter"></select>
                </div>
                <div class="col-md-6 col-lg-4">
                    <label class="form-label text-muted small text-uppercase">Направление</label>
                    <select class="form-select" id="groupDirectionFilter"></select>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6 col-lg-2">
                    <label class="form-label text-muted small text-uppercase">Уровень образования</label>
                    <select class="form-select" id="groupEducationLevelFilter">
                        <option value="">Все</option>
                        <option value="BACHELOR">Бакалавр</option>
                        <option value="SPECIALIST">Специалитет</option>
                        <option value="MASTER">Магистратура</option>
                    </select>
                </div>
                <div class="col-md-6 col-lg-1">
                    <label class="form-label text-muted small text-uppercase">Курс</label>
                    <select class="form-select" id="groupCourseFilter">
                        <option value="">Все</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
                <div class="col-md-6 col-lg-2">
                    <label class="form-label text-muted small text-uppercase">Форма обучения</label>
                    <select class="form-select" id="groupEducationFormFilter">
                        <option value="">Все</option>
                        <option value="FULL_TIME">Очная</option>
                        <option value="PART_TIME">Очно-заочная</option>
                        <option value="DISTANCE">Заочная</option>
                    </select>
                </div>
                <div class="col-md-6 col-lg-2">
                    <label class="form-label text-muted small text-uppercase">Ускоренная форма</label>
                    <div class="filter-check-control">
                        <div class="form-check m-0">
                            <input class="form-check-input" type="checkbox" id="groupAcceleratedFilter">
                            <label class="form-check-label" for="groupAcceleratedFilter">
                                Ускоренные
                            </label>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-2">
                    <label class="form-label text-muted small text-uppercase">Сортировка</label>
                    <select class="form-select" id="groupSort">
                        <option value="name" selected>По алфавиту</option>
                        <option value="faculty">По факультету</option>
                        <option value="direction">По направлению</option>
                        <option value="code">По коду</option>
                    </select>
                </div>
                <div class="col-md-6 col-lg-2">
                    <label class="form-label text-muted small text-uppercase">Направление сортировки</label>
                    <select class="form-select" id="groupSortDirection">
                        <option value="asc" selected>По возрастанию</option>
                        <option value="desc">По убыванию</option>
                    </select>
                </div>
                <div class="col-md-6 col-lg-1 d-flex align-items-end">
                    <button class="btn btn-outline-dark w-100" id="resetGroupFilters" type="button" title="Сбросить фильтры и поиск" aria-label="Сбросить фильтры и поиск">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h2 class="h5 fw-bold mb-0">Список групп</h2>
                <span class="badge text-bg-light" id="groupsCount">0</span>
            </div>
            <div class="table-responsive">
                <table class="table table-clean table-groups align-middle">
                    <thead>
                    <tr>
                        <th class="col-name">Название</th>
                        <th class="col-course">Курс</th>
                        <th class="col-direction">Направление</th>
                        <th class="col-faculty">Факультет</th>
                        <th class="col-students">Студентов</th>
                        <th class="col-actions">Действия</th>
                    </tr>
                    </thead>
                    <tbody id="groupsTable">
                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">Загрузка...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 mt-3">
                <div class="d-flex align-items-center gap-2">
                    <span class="text-muted small text-uppercase">На странице</span>
                    <select class="form-select form-select-sm w-auto" id="groupsPageSize">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
                <div class="d-flex align-items-center gap-1 flex-wrap">
                    <button class="btn btn-outline-dark btn-sm px-2" id="groupsPageFirst" type="button">&lt;&lt;</button>
                    <button class="btn btn-outline-dark btn-sm px-2" id="groupsPagePrev" type="button">&lt;</button>
                    <div class="d-flex align-items-center gap-1" id="groupsPageNumbers"></div>
                    <button class="btn btn-outline-dark btn-sm px-2" id="groupsPageNext" type="button">&gt;</button>
                    <button class="btn btn-outline-dark btn-sm px-2" id="groupsPageLast" type="button">&gt;&gt;</button>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="groupModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-spacious">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h2 class="modal-title h5" id="groupModalTitle">Новая группа</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <form class="row g-3 needs-validation" id="groupForm" novalidate>
                    <input type="hidden" id="groupId">
                    <div class="col-md-6">
                        <label class="form-label">Факультет *</label>
                        <select class="form-select" id="groupFacultySelect" required></select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Направление *</label>
                        <select class="form-select" id="groupDirectionSelect" required></select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Уровень образования *</label>
                        <select class="form-select" id="groupEducationLevel" required>
                            <option value="">Выберите уровень</option>
                            <option value="BACHELOR">Бакалавр</option>
                            <option value="SPECIALIST">Специалитет</option>
                            <option value="MASTER">Магистратура</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Форма обучения *</label>
                        <select class="form-select" id="groupEducationForm" required>
                            <option value="">Выберите форму</option>
                            <option value="FULL_TIME">Очная</option>
                            <option value="PART_TIME">Очно-заочная</option>
                            <option value="DISTANCE">Заочная</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Курс *</label>
                        <select class="form-select" id="groupCourse" required>
                            <option value="">Выберите курс</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Номер группы *</label>
                        <select class="form-select" id="groupNumber" required>
                            <option value="">Выберите номер</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <div class="form-check mb-0">
                            <input class="form-check-input" type="checkbox" id="groupAccelerated">
                            <label class="form-check-label" for="groupAccelerated">
                                Ускоренная форма обучения
                            </label>
                        </div>
                        <div class="form-text">Включите, если группа обучается по ускоренной программе.</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Название группы</label>
                        <input type="text" class="form-control" id="groupCodePreview" readonly>
                        <div class="form-text">Формируется автоматически и обновляется сразу при изменении параметров.</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-0">
                <button class="btn btn-outline-dark" data-bs-dismiss="modal">Отмена</button>
                <button class="btn btn-dark" id="saveGroupBtn">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="/js/layout.js?v=20260420-01"></script>
<script src="/js/app.js?v=20260422-100"></script>

</body>
</html>
