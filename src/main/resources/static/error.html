<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ошибка системы — Университет</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css?v=20260422-91">
</head>
<body>
<div id="appHeaderMount"></div>
<main class="page-shell">
    <div class="container">
        <section class="card-glass p-4 p-md-5 mx-auto" style="max-width: 960px;">
            <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap mb-3">
                <div>
                    <p class="section-title mb-1">Системное сообщение</p>
                    <h1 class="h3 mb-0">Произошла ошибка</h1>
                </div>
                <span class="badge text-bg-danger fs-6" id="errorStatusBadge">Ошибка</span>
            </div>

            <p class="lead mb-2" id="errorMessageText">Не удалось выполнить операцию.</p>
            <p class="text-muted mb-4" id="errorHintText">Попробуйте повторить действие позже.</p>

            <div class="alert alert-light border mb-4">
                <div class="small text-uppercase text-muted mb-1">Техническая метка</div>
                <div class="fw-semibold" id="errorSourceText">Не указана</div>
            </div>

            <details id="errorDetailsBlock" class="mb-4">
                <summary class="fw-semibold">Технические подробности</summary>
                <pre class="mt-2 mb-0 p-3 bg-light border rounded-3 text-wrap" id="errorDetailsText"></pre>
            </details>

            <div class="d-flex gap-2 flex-wrap">
                <a href="/" class="btn btn-accent">
                    <i class="bi bi-house me-1"></i>На главную
                </a>
                <button id="goBackBtn" type="button" class="btn btn-outline-soft">
                    <i class="bi bi-arrow-left me-1"></i>Вернуться назад
                </button>
            </div>
        </section>
    </div>
</main>

<script src="/js/layout.js?v=20260420-01"></script>
<script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const statusRaw = params.get('status');
        const status = Number.parseInt(statusRaw || '', 10);
        const message = (params.get('message') || '').trim();
        const hint = (params.get('hint') || '').trim();
        const source = (params.get('source') || '').trim();
        const details = (params.get('details') || '').trim();

        const statusBadge = document.getElementById('errorStatusBadge');
        const messageText = document.getElementById('errorMessageText');
        const hintText = document.getElementById('errorHintText');
        const sourceText = document.getElementById('errorSourceText');
        const detailsBlock = document.getElementById('errorDetailsBlock');
        const detailsText = document.getElementById('errorDetailsText');
        const goBackBtn = document.getElementById('goBackBtn');

        if (Number.isFinite(status)) {
            statusBadge.textContent = `Ошибка ${status}`;
        } else {
            statusBadge.textContent = 'Системная ошибка';
        }

        messageText.textContent = message || 'Не удалось выполнить операцию.';
        hintText.textContent = hint || 'Попробуйте повторить действие позже. Если ошибка повторяется, обратитесь к администратору.';
        sourceText.textContent = source || 'Не указана';

        if (details) {
            detailsText.textContent = details;
        } else {
            detailsBlock.hidden = true;
        }

        goBackBtn.addEventListener('click', () => {
            const referrer = document.referrer;
            if (!referrer) {
                window.location.assign('/');
                return;
            }

            try {
                const referrerUrl = new URL(referrer);
                if (referrerUrl.origin === window.location.origin) {
                    window.history.back();
                    return;
                }
            } catch (e) {
                // ignore invalid referrer and fallback to main page
            }

            window.location.assign('/');
        });
    })();
</script>
</body>
</html>
