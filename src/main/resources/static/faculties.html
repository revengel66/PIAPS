<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Факультеты — Университет</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css?v=20260420-18">
</head>

<body>
<div id="appHeaderMount" data-active="faculties"></div>
<main class="page-shell" id="facultiesPage">
    <div class="container">
        <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3 mb-4">
            <div>
                <p class="section-title mb-1">Справочник</p>
                <h1 class="h3 fw-bold text-uppercase mb-0">Факультеты</h1>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-outline-dark" id="reloadFaculties">
                    <i class="bi bi-arrow-clockwise me-1"></i>Обновить
                </button>
                <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#facultyModal">
                    <i class="bi bi-plus-lg me-1"></i>Факультет
                </button>
            </div>
        </div>

        <div class="card-glass p-3 p-md-4">
            <h2 class="h5 fw-bold mb-3">Список факультетов</h2>
            <div class="table-responsive">
                <table class="table table-clean table-faculties align-middle">
                    <thead>
                    <tr>
                        <th class="col-name">Название</th>
                        <th class="col-short" title="Аббревиатура">Аббр.</th>
                        <th class="col-short">Студентов</th>
                        <th class="text-end">Действия</th>
                    </tr>
                    </thead>
                    <tbody id="facultiesTable">
                    <tr>
                        <td colspan="4" class="text-center text-muted py-4">Загрузка...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 mt-3">
                <div class="d-flex align-items-center gap-2">
                    <span class="text-muted small text-uppercase">На странице</span>
                    <select class="form-select form-select-sm w-auto" id="facultiesPageSize">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
                <div class="d-flex align-items-center gap-1 flex-wrap">
                    <button class="btn btn-outline-dark btn-sm px-2" id="facultiesPageFirst" type="button">&lt;&lt;</button>
                    <button class="btn btn-outline-dark btn-sm px-2" id="facultiesPagePrev" type="button">&lt;</button>
                    <div class="d-flex align-items-center gap-1" id="facultiesPageNumbers"></div>
                    <button class="btn btn-outline-dark btn-sm px-2" id="facultiesPageNext" type="button">&gt;</button>
                    <button class="btn btn-outline-dark btn-sm px-2" id="facultiesPageLast" type="button">&gt;&gt;</button>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="facultyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-spacious">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h2 class="modal-title h5" id="facultyModalTitle">Новый факультет</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <form class="row g-3 needs-validation" id="facultyForm" novalidate>
                    <input type="hidden" id="facultyId">
                    <div class="col-12">
                        <label class="form-label">Название *</label>
                        <div class="input-group">
                            <span class="input-group-text">Факультет</span>
                            <input type="text"
                                   class="form-control"
                                   id="facultyName"
                                   required
                                   minlength="2"
                                   pattern="[A-Za-zА-Яа-яЁё\-\s]+"
                                   placeholder="информационных технологий">
                            <div class="invalid-feedback" id="facultyNameFeedback" data-field="name">Название факультета выглядит некорректно.</div>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Аббревиатура</label>
                        <input type="text"
                               class="form-control"
                               id="facultyShortName"
                               maxlength="32"
                               placeholder="Например, ФИТ">
                    </div>
                </form>
            </div>
            <div class="modal-footer border-0">
                <button class="btn btn-outline-dark" data-bs-dismiss="modal">Отмена</button>
                <button class="btn btn-dark" id="saveFacultyBtn">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="/js/layout.js?v=20260420-01"></script>
<script src="/js/app.js?v=20260422-100"></script>

</body>
</html>
