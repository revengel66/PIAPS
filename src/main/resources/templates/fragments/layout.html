<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Университет</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="appHeader(active)">
    <div class="container pt-3">
        <nav class="nav nav-pills nav-fill nav-top">
            <a class="nav-link" th:classappend="${active}=='dashboard' ? 'active' : ''" th:href="@{/dashboard}">Панель</a>
            <a class="nav-link" th:classappend="${active}=='students' ? 'active' : ''" th:href="@{/students}">Студенты</a>
            <a class="nav-link" th:classappend="${active}=='groups' ? 'active' : ''" th:href="@{/groups}">Группы</a>
            <a class="nav-link" th:classappend="${active}=='directions' ? 'active' : ''" th:href="@{/directions}">Направления</a>
            <a class="nav-link" th:classappend="${active}=='curriculums' ? 'active' : ''" th:href="@{/curriculums}">Учебные планы</a>
            <a class="nav-link" th:classappend="${active}=='orders' ? 'active' : ''" th:href="@{/orders}">Приказы</a>
            <a class="nav-link" th:classappend="${active}=='reports' ? 'active' : ''" th:href="@{/reports}">Отчёты</a>
            <a class="nav-link" href="#" aria-disabled="true">Выйти</a>
        </nav>
    </div>
</header>

<th:block th:fragment="baseScripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>
</body>
</html>
