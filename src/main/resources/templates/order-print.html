<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Печать приказа')"></head>
<body class="bg-white">
<main class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h4 fw-bold mb-0">Движение контингента студентов</h1>
            <button class="btn btn-outline-dark" onclick="window.print()">
                <i class="bi bi-printer me-1"></i>Печать
            </button>
        </div>
        <div class="card-glass p-4 shadow-soft">
            <div class="d-flex justify-content-between mb-3">
                <div>
                    <div class="text-muted small">Номер приказа</div>
                    <div class="h5" th:text="${order.number}">-</div>
                </div>
                <div class="text-end">
                    <div class="text-muted small">Дата</div>
                    <div class="h5" th:text="${order.orderDate}">-</div>
                </div>
            </div>
            <div class="mb-3">
                <span class="app-badge">[[${order.type}]]</span>
            </div>
            <p class="lh-lg" th:text="${order.text}">Текст приказа</p>
            <hr>
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="text-muted small">Подписант</div>
                    <div th:text="${order.signerName}">—</div>
                    <div class="text-muted" th:text="${order.signerPosition}"></div>
                </div>
                <div class="col-md-6 text-md-end">
                    <div class="text-muted small">Дата подписи</div>
                    <div th:text="${order.signDate}">—</div>
                </div>
            </div>
            <div class="mt-4">
                <div class="text-muted small">Студенты</div>
                <div th:text="${order.studentsList}">—</div>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="fragments/layout :: baseScripts"></th:block>
</body>
</html>
