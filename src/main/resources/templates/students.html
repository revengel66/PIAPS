<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Студенты — Университет')"></head>
<body>
<th:block th:replace="fragments/layout :: appHeader('students')"></th:block>
<main class="page-shell" id="studentsPage">
    <div class="container">
        <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3 mb-4">
            <div>
                <p class="section-title mb-1">Контингент</p>
                <h1 class="h3 fw-bold text-uppercase mb-0">Студенты</h1>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-outline-dark" id="resetStudentFilters">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>Сбросить фильтры
                </button>
                <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#studentModal">
                    <i class="bi bi-plus-lg me-1"></i>Добавить студента
                </button>
            </div>
        </div>

        <div class="card-glass p-3 p-md-4 mb-4">
            <div class="row g-3">
                <div class="col-12 col-lg-3">
                    <label class="form-label text-muted small text-uppercase">Факультет</label>
                    <select class="form-select" id="filterFaculty"></select>
                </div>
                <div class="col-12 col-lg-3">
                    <label class="form-label text-muted small text-uppercase">Направление</label>
                    <select class="form-select" id="filterDirection"></select>
                </div>
                <div class="col-12 col-lg-2">
                    <label class="form-label text-muted small text-uppercase">Группа</label>
                    <select class="form-select" id="filterGroup"></select>
                </div>
                <div class="col-6 col-lg-2">
                    <label class="form-label text-muted small text-uppercase">Курс</label>
                    <select class="form-select" id="filterCourse">
                        <option value="">Все</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
                <div class="col-6 col-lg-2">
                    <label class="form-label text-muted small text-uppercase">Статус</label>
                    <select class="form-select" id="filterStatus">
                        <option value="">Все</option>
                        <option value="ACTIVE">Обучается</option>
                        <option value="ACADEMIC_LEAVE">Академ</option>
                        <option value="EXPELLED">Отчислен</option>
                        <option value="GRADUATED">Выпустился</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label text-muted small text-uppercase">Поиск по ФИО или № зачётки</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="filterSearch" placeholder="Например, Иванов">
                        <button class="btn btn-outline-dark" id="applyStudentFilters">Найти</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-glass p-3 p-md-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h2 class="h5 fw-bold mb-0">Список студентов</h2>
                <span class="badge text-bg-light" id="studentsCount">0</span>
            </div>
            <div class="table-responsive">
                <table class="table table-clean align-middle">
                    <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Зачётка</th>
                        <th>Курс</th>
                        <th>Группа</th>
                        <th>Направление</th>
                        <th>Факультет</th>
                        <th>Статус</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="studentTableBody">
                    <tr>
                        <td colspan="8" class="text-center text-muted py-4">Загрузка...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 mt-3">
                <div class="d-flex align-items-center gap-2">
                    <span class="text-muted small text-uppercase">На странице</span>
                    <select class="form-select form-select-sm w-auto" id="pageSize">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-outline-dark btn-sm" id="pagePrev">
                        <i class="bi bi-chevron-left"></i> Назад
                    </button>
                    <span class="text-muted" id="paginationInfo">Стр. 1 из 1</span>
                    <button class="btn btn-outline-dark btn-sm" id="pageNext">
                        Вперёд <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="studentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-spacious">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h2 class="modal-title h5" id="studentModalTitle">Добавление студента</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <form id="studentForm" class="row g-3 needs-validation" novalidate>
                    <input type="hidden" id="studentId">
                    <div class="col-md-4">
                        <label class="form-label">Фамилия *</label>
                        <input type="text" class="form-control" id="lastName" required>
                        <div class="invalid-feedback">Укажите фамилию</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Имя *</label>
                        <input type="text" class="form-control" id="firstName" required>
                        <div class="invalid-feedback">Укажите имя</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Отчество</label>
                        <input type="text" class="form-control" id="middleName">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">№ зачётной книжки *</label>
                        <input type="text" class="form-control" id="recordBook" required>
                        <div class="invalid-feedback">Введите номер</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Курс *</label>
                        <input type="number" min="1" max="6" class="form-control" id="course" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Статус *</label>
                        <select class="form-select" id="status" required>
                            <option value="ACTIVE">Обучается</option>
                            <option value="ACADEMIC_LEAVE">Академ</option>
                            <option value="EXPELLED">Отчислен</option>
                            <option value="GRADUATED">Выпустился</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Факультет *</label>
                        <select class="form-select" id="studentFaculty" required></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Направление *</label>
                        <select class="form-select" id="studentDirection" required></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Группа *</label>
                        <select class="form-select" id="studentGroup" required></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Телефон</label>
                        <input type="text" class="form-control" id="phone">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Дата рождения</label>
                        <input type="date" class="form-control" id="birthDate">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Дата зачисления</label>
                        <input type="date" class="form-control" id="enrollmentDate">
                    </div>
                </form>
            </div>
            <div class="modal-footer border-0">
                <button class="btn btn-outline-dark" data-bs-dismiss="modal">Отмена</button>
                <button class="btn btn-dark" id="saveStudentBtn">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="fragments/layout :: baseScripts"></th:block>
</body>
</html>
